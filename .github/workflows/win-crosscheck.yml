name: Windows cross-platform check
on: workflow_dispatch
jobs:
  run-flagship-case:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync deps (uv, lockfile-pinned)
        run: uv sync
      - name: Demo (deterministic, no key needed — generates audit.jsonl for the tamper test)
        run: uv run siftpp-demo
      - name: Guardrail tests (no key needed)
        run: |
          uv run siftpp-spoliation-test
          uv run siftpp-tamper-test
      # Investigate step deferred: needs case data from the SANS Egnyte link,
      # which is expired as of Round 3 (reported to organizers). Also needs
      # ANTHROPIC_API_KEY as a repo secret, not yet set. Re-add once both are
      # in place.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-guardrail-results
          path: |
            analysis/demo/**
            analysis/spoliation/**
            analysis/tamper/**
